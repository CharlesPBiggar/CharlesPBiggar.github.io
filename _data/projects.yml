# Single source of truth for the "Project Showcase" menu and the homepage cards.
# Add a project here and it appears in both places.
#
# sections -> groups (optional label) -> items
#   url:      site page (starts with /) or full external URL
#   external: true for links that leave this site
#   thumb:    image in /images/thumbs (720x405)

- id: data-analytics
  title: Data Analytics
  groups:
