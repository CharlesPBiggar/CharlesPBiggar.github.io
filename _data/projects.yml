        - title: Weather Dashboard
          url: https://charlespbiggar.github.io/Weather_Web_Visualization_Dashboard/index.html
          external: true
          thumb: weather-dashboard.jpg
          tags: [Python, Matplotlib, API]
          summary: How weather changes with latitude across 500+ cities, using OpenWeatherMap data.
        - title: Pymaceuticals Analysis
          url: https://github.com/CharlesPBiggar/Pymaceuticals
          external: true
          thumb: pymaceuticals.jpg
          tags: [Pandas, Matplotlib, Jupyter]
          summary: Clinical trial analysis comparing tumor response across four drug regimens.

